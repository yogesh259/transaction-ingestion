spring:
  application:
    name: transaction-ingestion
  jackson:
    deserialization:
      # Treat unknown enum values as null (then rejected per-row by validation).
      read-unknown-enum-values-as-null: true
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/transactions_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&rewriteBatchedStatements=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # Size to the DB's real capacity; verify under load. Must be <= MySQL max_connections.
      maximum-pool-size: ${DB_POOL_MAX:50}
      minimum-idle: ${DB_POOL_MIN_IDLE:10}
      connection-timeout: 10000
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only validates against it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # Map java.time.Instant to MySQL DATETIME(6) to match the migrations.
        type:
          preferred_instant_jdbc_type: TIMESTAMP
        # Group writes into JDBC batches (AUTO_INCREMENT ids limit INSERT batching).
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        # Default and maximum page size for paged endpoints.
        default-page-size: 20
        max-page-size: 200

server:
  # Hosting platforms (Render, Railway, ...) inject PORT.
  port: ${PORT:8080}
  compression:
    enabled: true
  tomcat:
    threads:
      # HTTP worker threads handle synchronous bulk-ingest requests.
      max: 200
      min-spare: 50

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# ---- Application-specific configuration ----
categorization:
  # Maximum number of rows accepted per bulk request.
  max-bulk-size: 20000
  # Enable or disable the LLM fallback strategy.
  fallback:
    enabled: true
  # Thread pool that runs per-merchant categorisation in parallel (max-size = parallelism).
  async:
    core-size: ${CATEGORISATION_POOL_CORE:8}
    max-size: ${CATEGORISATION_POOL_MAX:16}
    queue-capacity: 1000
    thread-name-prefix: cat-
  # LLM client settings. Leave api-key empty to disable outbound calls.
  llm:
    # Google Gemini generateContent API.
    base-url: ${LLM_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:gemini-2.5-flash}
    timeout-seconds: 15

# Allows DELETE /api/v1/transactions (the UI's "Clear data" button).
app:
  reset-enabled: ${APP_RESET_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

logging:
  level:
    com.example.ingestion: INFO

