spring:
  application:
    name: transaction-ingestion
  jackson:
    deserialization:
      # Treat unknown enum values as null (then rejected per-row by validation).
      read-unknown-enum-values-as-null: true
  datasource:
    url: jdbc:mysql://localhost:3306/transactions_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only validates against it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # Map java.time.Instant to MySQL DATETIME(6) to match the migrations.
        type:
          preferred_instant_jdbc_type: TIMESTAMP
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        # Default and maximum page size for paged endpoints.
        default-page-size: 20
        max-page-size: 200

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# ---- Application-specific configuration ----
categorization:
  # Maximum number of rows accepted per bulk request.
  max-bulk-size: 1000
  # Enable or disable the LLM fallback strategy.
  fallback:
    enabled: true
  # Thread pool for the asynchronous categorisation trigger.
  async:
    core-size: 4
    max-size: 8
    queue-capacity: 100
    thread-name-prefix: cat-
  # LLM client settings. Leave api-key empty to disable outbound calls.
  llm:
    base-url: ${LLM_BASE_URL:https://api.openai.com/v1}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:gpt-4o-mini}
    timeout-seconds: 15

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

logging:
  level:
    com.example.ingestion: INFO

