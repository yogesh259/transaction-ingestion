# Profile used inside docker-compose (activated via SPRING_PROFILES_ACTIVE=docker).
# Only overrides what differs from application.yml.
spring:
  datasource:
    url: jdbc:mysql://mysql:3306/transactions_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&rewriteBatchedStatements=true
    username: ${DB_USERNAME:app}
    password: ${DB_PASSWORD:app}

categorization:
  llm:
    base-url: https://generativelanguage.googleapis.com/v1beta
    model: gemini-2.5-flash