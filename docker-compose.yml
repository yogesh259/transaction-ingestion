services:
  mysql:
    image: mysql:8.0
    container_name: ingestion-mysql
    # Demo tuning: more connections + relaxed commit fsync for faster bulk inserts.
    command: --max-connections=300 --innodb-flush-log-at-trx-commit=2
    environment:
      MYSQL_DATABASE: transactions_db
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: ingestion-app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USERNAME: app
      DB_PASSWORD: app
      LLM_API_KEY: ${LLM_API_KEY:-}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 768M

volumes:
  mysql-data: